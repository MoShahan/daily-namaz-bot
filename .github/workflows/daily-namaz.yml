
name: Daily Namaz Timings

on:
  schedule:
    # 12:01 AM IST = 18:31 UTC (previous day)
    - cron: "31 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-namaz-timings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process commands and send Namaz timings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CALCULATION_METHOD: "1"
          ASR_SCHOOL: "0"
        run: python bot.py

      - name: Save updated location and Telegram update ID
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add location.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Namaz bot location state"
            git push
          else
            echo "No location state changes to save."
          fi
